<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halif Media</title>
<meta name="description" content="Halif Media — an influencer partnerships agency. New site coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --charcoal: #28282A;
    --cream: #FBFAF8;
    --burgundy: #7A3B4E;
    --greige: #E4E1DC;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--charcoal);
    color: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 560px;
    text-align: center;
  }

  .mark {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    letter-spacing: 0.02em;
    margin: 0 0 22px;
  }

  .rule {
    width: 44px;
    height: 3px;
    background: var(--burgundy);
    margin: 0 auto 22px;
    border-radius: 2px;
  }

  .status {
    font-family: 'Unbounded', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--greige);
    margin: 0 0 20px;
  }

  .tagline {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--greige);
    max-width: 44ch;
    margin: 0 auto 34px;
  }

  .contact {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.98rem;
  }

  .contact a {
    color: var(--cream);
    text-decoration: none;
    border-bottom: 1px solid var(--burgundy);
    padding-bottom: 2px;
  }

  .contact a:hover { color: var(--burgundy); }

  footer {
    margin-top: 46px;
    font-size: 0.82rem;
    color: rgba(251, 250, 248, 0.45);
  }
</style>
</head>
<body>

  <div class="wrap">
    <h1 class="mark">Halif Media</h1>
    <div class="rule"></div>
    <p class="status">New site coming soon</p>
    <p class="tagline">We help brands expand their reach through the right creators, and deliver the partnership deals that make it real.</p>
    <p class="contact">Get in touch — <a href="mailto:rehmani@meethalif.com">rehmani@meethalif.com</a></p>
    <footer>Halif Media © 2026</footer>
  </div>

</body>
</html>
